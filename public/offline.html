<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b16">
<title>Offline · MLBB Draft Coach</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    background: radial-gradient(700px 400px at 80% -10%, rgba(92,200,255,.13), transparent 60%), #070b16;
    color: #eef2fb; font: 400 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 360px; display: grid; gap: 14px; justify-items: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 0; font: 800 28px/1.1 "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .02em; }
  p { margin: 0; color: #8f9bb8; }
  button { margin-top: 6px; padding: 13px 24px; border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #f5c451, #ff9f43); color: #1d1300; font: 800 15px/1 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>The draft coach needs an internet connection to read the pro data and ask the AI. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
