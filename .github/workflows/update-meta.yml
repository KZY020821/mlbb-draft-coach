name: Update pro meta data

# Pulls MPL ID, PH and MY drafts from the Liquipedia API, infers positions, rebuilds data/meta.json
# and data/pro-games.json, refreshes team logos in public/teams, and commits them.
# The commit redeploys the site on Vercel.
on:
  schedule:
    - cron: "17 0 * * 2" # every Tuesday, 08:17 Malaysia/Philippine time (00:17 UTC), after the weekend matches
    # TEMPORARY for the MPL PH Season 18 playoffs: also 23:17 Philippine time (15:17 UTC) on 25 and 26
    # October, after each day's matches. Remove after 26 October 2026 (it would fire again next October).
    - cron: "17 15 25-26 10 *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test alert email even if nothing needs fixing"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/meta/**"
      - "scripts/update-meta.mjs"
      - "scripts/check-health.mjs"
      - "scripts/send-alert.mjs"
      - "data/meta-config.json"
      - "data/position-overrides.json"
      - ".github/workflows/update-meta.yml"

permissions:
  contents: write

concurrency:
  group: update-meta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the pipeline
        run: node scripts/test-meta.mjs
      - name: Build meta data from Liquipedia
        env:
          LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}
        run: |
          set -o pipefail
          node scripts/update-meta.mjs 2>&1 | tee build.log
      - name: Commit if the data changed
        run: |
          git config user.name "meta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.json data/pro-games.json data/team-logos.json public/teams
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update pro meta data from Liquipedia"
            git push
          fi
      - name: Check for things that need a person
        env:
          LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}
        run: node scripts/check-health.mjs
      # Emails the owner when any step failed or a check found something. Needs the
      # SMTP_USER, SMTP_PASSWORD (Gmail app password) and ALERT_EMAIL repository secrets.
      - name: Email the owner if something needs fixing
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "${{ job.status }}" != "success" ]; then
            SUBJECT="MLBB Draft Coach: the weekly data update failed"
            {
              echo "The weekly pro data update did not finish, so the site is still using the previous data."
              echo
              echo "Run: $RUN_URL"
              echo
              echo "Last lines of the log:"
              tail -n 25 build.log 2>/dev/null || echo "(the build step did not start)"
            } > email.txt
          elif [ "${{ inputs.test_email }}" = "true" ]; then
            SUBJECT="MLBB Draft Coach: test alert"
            {
              echo "This is a test. Alerts from the weekly data update will arrive like this."
              echo
              if [ -s alerts.txt ]; then cat alerts.txt; else echo "Right now nothing needs fixing."; fi
              echo
              echo "Run: $RUN_URL"
            } > email.txt
          elif [ -s alerts.txt ]; then
            SUBJECT="MLBB Draft Coach: something needs updating"
            { cat alerts.txt; echo; echo; echo "Run: $RUN_URL"; } > email.txt
          else
            echo "Nothing to report."
            exit 0
          fi
          npm install --no-save --no-audit --no-fund nodemailer@6.9.16 > /dev/null
          node scripts/send-alert.mjs "$SUBJECT" email.txt
